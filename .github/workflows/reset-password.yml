# Reset password user Supabase Auth existing berdasarkan email.
# Menjalankan scripts/reset-user-password.mjs dengan service-role key dari GitHub Secrets,
# supaya key dan password baru tidak pernah keluar dari lingkungan CI (tidak masuk sesi chat).
#
# Trigger: manual lewat tab Actions -> "Reset Password User" -> "Run workflow".
#
# WAJIB sudah di-set di GitHub: Settings -> Secrets and variables -> Actions
#   SUPABASE_SERVICE_ROLE_KEY : Service role key (Dashboard -> Project Settings -> API -> service_role)
#   SUPABASE_PROJECT_REF      : Project ref ATAU
#   SUPABASE_URL              : URL penuh https://<ref>.supabase.co (opsional bila PROJECT_REF ada)
#
# CATATAN KEAMANAN: service_role mem-bypass seluruh RLS. Password baru diisi lewat input
# workflow_dispatch (tidak dicetak ke log) dan hanya dipakai sekali oleh langkah terakhir.

name: Reset Password User

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode jalan"
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - apply
      email:
        description: "Email user yang password-nya akan direset"
        type: string
        required: true
      password:
        description: "Password baru (wajib diisi saat mode=apply, minimal 8 karakter)"
        type: string
        required: false
        default: ""

jobs:
  reset-password:
    runs-on: ubuntu-latest
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Tentukan SUPABASE_URL
        run: |
          if [ -z "$SUPABASE_URL" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "SUPABASE_URL=https://${SUPABASE_PROJECT_REF}.supabase.co" >> "$GITHUB_ENV"
          fi

      - name: Validasi secrets tersedia
        run: |
          missing=0
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Secret SUPABASE_SERVICE_ROLE_KEY belum di-set di GitHub repo secrets."
            missing=1
          fi
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL/SUPABASE_PROJECT_REF belum tersedia sebagai secret."
            missing=1
          fi
          [ "$missing" -eq 0 ] || exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependency yang dibutuhkan skrip
        run: npm install --no-save --no-audit --no-fund @supabase/supabase-js@^2.86.0

      - name: Jalankan reset password
        env:
          MODE: ${{ inputs.mode }}
          EMAIL: ${{ inputs.email }}
          NEW_PASSWORD: ${{ inputs.password }}
        # Input dirakit lewat env + array argumen agar aman dari command injection dan
        # password tidak pernah dicetak ke log step ini.
        run: |
          args=("--email=$EMAIL")
          if [ "$MODE" = "apply" ]; then
            args+=("--apply" "--password=$NEW_PASSWORD")
          fi
          node scripts/reset-user-password.mjs "${args[@]}"

      - name: Selesai
        run: |
          if [ "${{ inputs.mode }}" = "apply" ]; then
            echo "Reset password selesai (APPLY). Periksa log langkah sebelumnya untuk status."
          else
            echo "Dry-run selesai. Jalankan ulang dengan mode=apply + password untuk benar-benar reset."
          fi
